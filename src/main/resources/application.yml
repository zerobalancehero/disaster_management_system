server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: disaster-emergency-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:disaster_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Application-specific properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: ${SEED_DEV_DATA:false}
  ml:
    mock-enabled: ${ML_MOCK_ENABLED:false}
    model-path: ${ML_MODEL_PATH:}
    feature-schema-version: "v1.0"
  integrations:
    open-meteo:
      base-url: ${OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}
      enabled: ${OPEN_METEO_ENABLED:true}
      timeout-seconds: 5
    usgs:
      base-url: ${USGS_URL:https://earthquake.usgs.gov/fdsnws/event/1/query}
      enabled: ${USGS_ENABLED:true}
      timeout-seconds: 5
    gdacs:
      base-url: ${GDACS_URL:https://www.gdacs.org/xml/rss.xml}
      enabled: ${GDACS_ENABLED:false}
      timeout-seconds: 5
    imd:
      base-url: ${IMD_URL:https://api.imd.gov.in/public}
      api-key: ${IMD_API_KEY:}
      enabled: ${IMD_ENABLED:false}
      timeout-seconds: 5
    osrm:
      base-url: ${OSRM_URL:http://localhost:5000}
      enabled: ${OSRM_ENABLED:false}
      timeout-seconds: 3
    notifications:
      email-enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
      sms-enabled: ${SMS_NOTIFICATIONS_ENABLED:false}
  cache:
    weather-ttl-minutes: 30
